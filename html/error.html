<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
	<title>出错了</title>
	<style>
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
			font-family: var(--vscode-font-family);
			font-size: var(--vscode-font-size);
			color: var(--vscode-editor-foreground);
			background: var(--vscode-editor-background);
		}
		.box { max-width: 520px; padding: 0 24px; text-align: center; }
		.icon { font-size: 34px; margin-bottom: 12px; }
		.message {
			line-height: 1.7;
			color: var(--vscode-descriptionForeground);
			white-space: pre-wrap;
			word-break: break-word;
		}
		.actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
		button {
			padding: 6px 16px;
			font-family: inherit;
			font-size: inherit;
			color: var(--vscode-button-foreground);
			background: var(--vscode-button-background);
			border: none;
			border-radius: 3px;
			cursor: pointer;
		}
		button:hover { background: var(--vscode-button-hoverBackground); }
		button.secondary {
			color: var(--vscode-button-secondaryForeground);
			background: var(--vscode-button-secondaryBackground);
		}
		button.secondary:hover { background: var(--vscode-button-secondaryHoverBackground); }
	</style>
</head>
<body>
	<div class="box">
		<div class="icon">⚠️</div>
		<div class="message">{{message}}</div>
		<div class="actions">
			{{if showLogin}}
			<button data-command="login">导入 Cookie</button>
			{{/if}}
			{{if showRefresh}}
			<button class="secondary" data-command="refresh">重试</button>
			{{/if}}
		</div>
	</div>
	<script nonce="{{nonce}}">
		const vscode = acquireVsCodeApi();
		document.querySelectorAll('button[data-command]').forEach((btn) => {
			btn.addEventListener('click', () => {
				vscode.postMessage({ command: btn.dataset.command });
			});
		});
	</script>
</body>
</html>
