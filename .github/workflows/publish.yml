name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      # 诊断：本地和 GitHub runner 都在认证那一步挂 180 秒，与网络位置无关。
      # 先单独确认 PAT 本身能不能被 marketplace 接受。
      - name: Diagnose PAT
        continue-on-error: true
        run: |
          U="https://marketplace.visualstudio.com/_apis/gallery/publishers/laryers?api-version=7.2-preview.1"
          echo "--- 1. baseline: no auth ---"
          curl -sS -o /dev/null -w "    HTTP %{http_code} in %{time_total}s\n" --max-time 30 "$U" || echo "    (failed)"
          echo "--- 2. with PAT ---"
          curl -sS -o /tmp/pub.json -w "    HTTP %{http_code} in %{time_total}s\n" --max-time 75 \
            -u ":$VSCE_PAT" "$U" || echo "    (timed out / failed)"
          echo "--- 3. response body ---"
          head -c 300 /tmp/pub.json 2>/dev/null || echo "    (empty)"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to VS Code Marketplace
        continue-on-error: true
        run: npx vsce publish --skip-duplicate --loglevel trace -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
