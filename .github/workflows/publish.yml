name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      # 连通性探针：区分「PAT 不被接受」和「发布流程本身有问题」。
      # 实测此步 0.07 秒返回 200，说明 PAT 与 runner 网络都正常。
      - name: Diagnose PAT
        continue-on-error: true
        run: |
          U="https://marketplace.visualstudio.com/_apis/gallery/publishers/laryers?api-version=7.2-preview.1"
          echo "--- with PAT ---"
          curl -sS -o /dev/null -w "    HTTP %{http_code} in %{time_total}s\n" --max-time 75 \
            -u ":$VSCE_PAT" "$U" || echo "    (timed out / failed)"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --skip-duplicate -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
